server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/games_platform?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
      password: root
      timeout: 3000ms

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

jwt:
  secret: games-platform-jwt-secret-key-2024-must-be-at-least-256-bits-long
  expiration: 86400000

logging:
  level:
    com.gamesplatform: DEBUG
