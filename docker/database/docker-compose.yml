# 基础设施：MySQL + Redis（独立部署，数据持久化）
# 首次启动: cd docker/database && docker compose up -d
# 注意: 仅 docker compose down -v 会清除数据库，日常更新应用请勿执行 -v

services:
  mysql:
    image: anolis-registry.cn-zhangjiakou.cr.aliyuncs.com/openanolis/mysql:8.0.30-8.6
    container_name: games-platform-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-games_platform}
      MYSQL_USER: ${MYSQL_USER:-games}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-games123}
    ports:
      - '${MYSQL_PORT:-3306}:3306'
    volumes:
      - mysql_data:/var/lib/mysql
      - ../../sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-uroot', '-p${MYSQL_ROOT_PASSWORD:-root123}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - games-platform

  redis:
    image: anolis-registry.cn-zhangjiakou.cr.aliyuncs.com/openanolis/redis:5.0.3-8.6
    container_name: games-platform-redis
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - games-platform

volumes:
  mysql_data:
    name: games-platform_mysql_data

networks:
  games-platform:
    name: games-platform-network
