# 应用：Admin + Admin UI（可频繁重建，不影响数据库）
# 前置条件: 先启动 docker/database
# 启动/更新: cd docker/app && ./deploy.sh

services:
  admin:
    image: ${ADMIN_IMAGE:-${BACKEND_IMAGE:-registry.cn-hangzhou.aliyuncs.com/aliyun_andy/games-platform-admin:1.0.0}}
    container_name: games-platform-admin
    restart: unless-stopped
    ports:
      - '${ADMIN_PORT:-${BACKEND_PORT:-8080}}:8080'
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MYSQL_HOST: ${MYSQL_HOST:-games-platform-mysql}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-games_platform}
      MYSQL_USER: ${MYSQL_USER:-games}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-games123}
      REDIS_HOST: ${REDIS_HOST:-games-platform-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-games-platform}
      JWT_SECRET: ${JWT_SECRET:-1f702134957b3c014fce729cc5a8d0dc5a29ea26f2f3316b593961c64c2252bc}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:-d0b6e66b3068b64348eb5472a7b9c0f833ad812ac4a6d5d8a4e17ec139a5548c}
      ADMIN_JWT_EXPIRATION: ${ADMIN_JWT_EXPIRATION:-28800000}
      ADMIN_BINDING_CODE_TTL_MINUTES: ${ADMIN_BINDING_CODE_TTL_MINUTES:-10}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.deepseek.com}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-not-configured}
      LLM_BASE_URL: ${LLM_BASE_URL:-${OPENAI_BASE_URL:-https://api.deepseek.com}}
      LLM_API_KEY: ${LLM_API_KEY:-${OPENAI_API_KEY:-not-configured}}
      LLM_MODEL: ${LLM_MODEL:-deepseek-v4-flash}
    networks:
      - games-platform

  admin-ui:
    image: ${ADMIN_UI_IMAGE:-${FRONTEND_IMAGE:-registry.cn-hangzhou.aliyuncs.com/aliyun_andy/games-platform-admin-ui:1.0.0}}
    container_name: games-platform-admin-ui
    restart: unless-stopped
    ports:
      - '${ADMIN_UI_PORT:-${FRONTEND_PORT:-80}}:80'
    environment:
      BACKEND_HOST: admin
      BACKEND_PORT: 8080
    depends_on:
      - admin
    networks:
      - games-platform

networks:
  games-platform:
    external: true
    name: games-platform-network
